<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker News Clone - Home</title>
    <link rel="stylesheet" href="{% static 'news/styles.css' %}">
</head>
<body>
    <header>
        <h1>Hacker News Clone</h1>
        <nav>
            <a href="{% url 'add_post' %}">Add Post</a>
        </nav>
    </header>
    <main>
        <ul class="post-list">
            {% for post in posts %}
            <li class="post-item">
                <h2><a href="{% url 'post_detail' post.id %}">{{ post.title }}</a></h2>
                <p>Posted by {{ post.posted_by }} on {{ post.created_at }}</p>
                <p>{{ post.vote_count }} votes</p>
            </li>
            {% empty %}
            <li>No posts available.</li>
            {% endfor %}
        </ul>
    </main>
    <footer>
        <p>&copy; 2024 Hacker News Clone</p>
    </footer>
</body>
</html>
